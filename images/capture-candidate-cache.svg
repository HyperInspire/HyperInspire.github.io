<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-labelledby="title desc">
<title id="title">Keep selected images by frame ID</title><desc id="desc">With one output requested, a lower-scoring new frame leaves the old selected frame in the image cache. A better candidate replaces it. The result object contains metadata rather than pixels.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#5b728b" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#20354d} .title{font-size:28px;font-weight:700} .label{font-size:23px;font-weight:600} .small{font-size:20px;fill:#52677c} .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:22px} .tiny{font-size:18px;fill:#52677c}</style>
<rect width="760" height="600" rx="18" fill="#f8fafc"/>
<text x="32" y="47" class="title" text-anchor="start">Keep selected images by frame ID</text>
<text x="32" y="88" class="small" text-anchor="start">Illustration: output_count = 1</text><text x="32" y="136" class="label" text-anchor="start">Frame / score</text><text x="302" y="136" class="label" text-anchor="start">Selected result</text><text x="535" y="136" class="label" text-anchor="start">App image cache</text><rect x="32" y="162" width="215" height="84" rx="14" fill="#edf2ff" stroke="#b6cee8" stroke-width="2"/><text x="48" y="194" class="mono" text-anchor="start">#12 · 0.72</text><text x="48" y="225" class="small" text-anchor="start">frame pixels</text><rect x="302" y="162" width="169" height="84" rx="14" fill="#e6f5ef" stroke="#add5c3" stroke-width="2"/><text x="386" y="195" class="mono" text-anchor="middle">frame_id 12</text><text x="386" y="225" class="tiny" text-anchor="middle">metadata only</text><rect x="535" y="162" width="193" height="84" rx="14" fill="#fff3df" stroke="#e4c691" stroke-width="2"/><text x="551" y="194" class="mono" text-anchor="start">copy #12</text><text x="551" y="225" class="tiny" text-anchor="start">save its pixels</text><path d="M247 204 L302 204" fill="none" stroke="#5b728b" stroke-width="3" marker-end="url(#arrow)"/><path d="M471 204 L535 204" fill="none" stroke="#5b728b" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="270" width="215" height="84" rx="14" fill="#edf2ff" stroke="#b6cee8" stroke-width="2"/><text x="48" y="302" class="mono" text-anchor="start">#13 · 0.60</text><text x="48" y="333" class="small" text-anchor="start">frame pixels</text><rect x="302" y="270" width="169" height="84" rx="14" fill="#e6f5ef" stroke="#add5c3" stroke-width="2"/><text x="386" y="303" class="mono" text-anchor="middle">frame_id 12</text><text x="386" y="333" class="tiny" text-anchor="middle">metadata only</text><rect x="535" y="270" width="193" height="84" rx="14" fill="#fff3df" stroke="#e4c691" stroke-width="2"/><text x="551" y="302" class="mono" text-anchor="start">keep #12</text><text x="551" y="333" class="tiny" text-anchor="start">discard #13</text><path d="M247 312 L302 312" fill="none" stroke="#5b728b" stroke-width="3" marker-end="url(#arrow)"/><path d="M471 312 L535 312" fill="none" stroke="#5b728b" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="378" width="215" height="84" rx="14" fill="#edf2ff" stroke="#b6cee8" stroke-width="2"/><text x="48" y="410" class="mono" text-anchor="start">#14 · 0.84</text><text x="48" y="441" class="small" text-anchor="start">frame pixels</text><rect x="302" y="378" width="169" height="84" rx="14" fill="#e6f5ef" stroke="#add5c3" stroke-width="2"/><text x="386" y="411" class="mono" text-anchor="middle">frame_id 14</text><text x="386" y="441" class="tiny" text-anchor="middle">metadata only</text><rect x="535" y="378" width="193" height="84" rx="14" fill="#fff3df" stroke="#e4c691" stroke-width="2"/><text x="551" y="410" class="mono" text-anchor="start">copy #14</text><text x="551" y="441" class="tiny" text-anchor="start">remove old #12</text><path d="M247 420 L302 420" fill="none" stroke="#5b728b" stroke-width="3" marker-end="url(#arrow)"/><path d="M471 420 L535 420" fill="none" stroke="#5b728b" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="529" class="label" text-anchor="start">Result IDs decide which images stay in the cache.</text><text x="32" y="568" class="small" text-anchor="start">Keep the selected image until a better candidate replaces it.</text>
</svg>