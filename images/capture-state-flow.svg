<svg xmlns="http://www.w3.org/2000/svg" width="760" height="716" viewBox="0 0 760 716" role="img" aria-labelledby="title desc">
<title id="title">Capture: the normal path and recovery</title><desc id="desc">A typical capture moves from idle to stabilizing, collecting and ready before finish. Losing the track can enter track lost during the grace period. The time limit can finish without ready.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#5b728b" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#20354d} .title{font-size:28px;font-weight:700} .label{font-size:23px;font-weight:600} .small{font-size:20px;fill:#52677c} .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:22px} .tiny{font-size:18px;fill:#52677c}</style>
<rect width="760" height="716" rx="18" fill="#f8fafc"/>
<text x="32" y="47" class="title" text-anchor="start">Capture: the normal path and recovery</text>
<text x="32" y="88" class="small" text-anchor="start">One synchronous update per frame + timestamp</text><rect x="32" y="117" width="246" height="61" rx="14" fill="#edf2ff" stroke="#b6cee8" stroke-width="2"/><text x="155" y="156" class="mono" text-anchor="middle">IDLE</text><text x="302" y="156" class="small" text-anchor="start">Waiting for a usable track</text><path d="M155 178 L155 205" fill="none" stroke="#5b728b" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="205" width="246" height="61" rx="14" fill="#edf2ff" stroke="#b6cee8" stroke-width="2"/><text x="155" y="244" class="mono" text-anchor="middle">STABILIZING</text><text x="302" y="244" class="small" text-anchor="start">Evaluate enabled filters</text><path d="M155 266 L155 293" fill="none" stroke="#5b728b" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="293" width="246" height="61" rx="14" fill="#edf2ff" stroke="#b6cee8" stroke-width="2"/><text x="155" y="332" class="mono" text-anchor="middle">COLLECTING</text><text x="302" y="332" class="small" text-anchor="start">Keep the best candidates</text><path d="M155 354 L155 381" fill="none" stroke="#5b728b" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="381" width="246" height="61" rx="14" fill="#e6f5ef" stroke="#b6cee8" stroke-width="2"/><text x="155" y="420" class="mono" text-anchor="middle">READY</text><text x="302" y="420" class="small" text-anchor="start">Enough candidates + collection time</text><path d="M155 442 L155 469" fill="none" stroke="#5b728b" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="469" width="246" height="61" rx="14" fill="#e6f5ef" stroke="#b6cee8" stroke-width="2"/><text x="155" y="508" class="mono" text-anchor="middle">FINISHED</text><text x="302" y="508" class="small" text-anchor="start">finish() called, or maximum time reached</text><rect x="32" y="585" width="696" height="104" rx="14" fill="#fff3df" stroke="#e4c691" stroke-width="2"/><text x="52" y="618" class="small" text-anchor="start">No face: TRACK_LOST within the grace period</text><text x="52" y="651" class="small" text-anchor="start">After grace: IDLE. reset() starts a new round.</text><text x="52" y="679" class="tiny" text-anchor="start">The maximum collection time can finish without READY.</text>
</svg>