<svg xmlns="http://www.w3.org/2000/svg" width="760" height="496" viewBox="0 0 760 496" role="img" aria-labelledby="title desc">
<title id="title">Image pixels → model tensor</title><desc id="desc">Choose a destination-to-source geometric transform, output color order, per-channel normalization and tensor layout explicitly. Output storage is owned by the caller.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#5b728b" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#20354d} .title{font-size:28px;font-weight:700} .label{font-size:23px;font-weight:600} .small{font-size:20px;fill:#52677c} .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:22px} .tiny{font-size:18px;fill:#52677c}</style>
<rect width="760" height="496" rx="18" fill="#f8fafc"/>
<text x="32" y="47" class="title" text-anchor="start">Image pixels → model tensor</text>
<text x="32" y="88" class="small" text-anchor="start">Configure geometry, color, values and layout</text><rect x="32" y="122" width="325" height="126" rx="14" fill="#edf2ff" stroke="#b6cee8" stroke-width="2"/><text x="52" y="156" class="label" text-anchor="start">1  Geometry</text><text x="52" y="195" class="mono" text-anchor="start">Destination → source</text><text x="52" y="229" class="small" text-anchor="start">crop / resize / affine</text><rect x="403" y="122" width="325" height="126" rx="14" fill="#e6f5ef" stroke="#b6cee8" stroke-width="2"/><text x="423" y="156" class="label" text-anchor="start">2  Color</text><text x="423" y="195" class="mono" text-anchor="start">BGR → RGB</text><text x="423" y="229" class="small" text-anchor="start">choose output_format</text><rect x="32" y="290" width="325" height="126" rx="14" fill="#fff3df" stroke="#b6cee8" stroke-width="2"/><text x="52" y="324" class="label" text-anchor="start">3  Values</text><text x="52" y="363" class="mono" text-anchor="start">(value − mean) × scale</text><text x="52" y="397" class="small" text-anchor="start">choose mean and scale</text><rect x="403" y="290" width="325" height="126" rx="14" fill="#f2edff" stroke="#b6cee8" stroke-width="2"/><text x="423" y="324" class="label" text-anchor="start">4  Layout</text><text x="423" y="363" class="mono" text-anchor="start">HWC → CHW</text><text x="423" y="397" class="small" text-anchor="start">caller-owned tensor buffer</text><path d="M357 184 L403 184" fill="none" stroke="#5b728b" stroke-width="3" marker-end="url(#arrow)"/><path d="M565 248 L565 270 L194 270 L194 290" fill="none" stroke="#5b728b" stroke-width="3" marker-end="url(#arrow)"/><path d="M357 352 L403 352" fill="none" stroke="#5b728b" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="464" class="small" text-anchor="start">Set the output size and destination-to-source transform.</text>
</svg>