<svg xmlns="http://www.w3.org/2000/svg" width="760" height="607" viewBox="0 0 760 607" role="img" aria-labelledby="title desc">
<title id="title">Match the descriptor to the bytes</title><desc id="desc">Camera rows can have padding. Copy only active BGR bytes from each row into a tightly packed buffer before passing HFImageData.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#5b728b" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#20354d} .title{font-size:28px;font-weight:700} .label{font-size:23px;font-weight:600} .small{font-size:20px;fill:#52677c} .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:22px} .tiny{font-size:18px;fill:#52677c}</style>
<rect width="760" height="607" rx="18" fill="#f8fafc"/>
<text x="32" y="47" class="title" text-anchor="start">Match the descriptor to the bytes</text>
<text x="32" y="88" class="small" text-anchor="start">Example: packed BGR pixels inside padded camera rows</text><text x="32" y="129" class="label" text-anchor="start">Camera buffer</text><rect x="32" y="150" width="540" height="35" rx="5" fill="#e6f5ef" stroke="#add5c3" stroke-width="2"/><rect x="572" y="150" width="156" height="35" rx="5" fill="#f2ece5" stroke="#d5c9bb" stroke-width="2"/><text x="48" y="175" class="mono" text-anchor="start">row 0: B G R · B G R · B G R · …</text><text x="650" y="175" class="tiny" text-anchor="middle">padding</text><rect x="32" y="194" width="540" height="35" rx="5" fill="#e6f5ef" stroke="#add5c3" stroke-width="2"/><rect x="572" y="194" width="156" height="35" rx="5" fill="#f2ece5" stroke="#d5c9bb" stroke-width="2"/><text x="48" y="219" class="mono" text-anchor="start">row 1: B G R · B G R · B G R · …</text><text x="650" y="219" class="tiny" text-anchor="middle">padding</text><rect x="32" y="238" width="540" height="35" rx="5" fill="#e6f5ef" stroke="#add5c3" stroke-width="2"/><rect x="572" y="238" width="156" height="35" rx="5" fill="#f2ece5" stroke="#d5c9bb" stroke-width="2"/><text x="48" y="263" class="mono" text-anchor="start">row 2: B G R · B G R · B G R · …</text><text x="650" y="263" class="tiny" text-anchor="middle">padding</text><text x="32" y="304" class="small" text-anchor="start">row stride = active pixel bytes + padding</text><path d="M380 325 L380 372" fill="none" stroke="#5b728b" stroke-width="3" marker-end="url(#arrow)"/><text x="403" y="354" class="small" text-anchor="start">copy active bytes row by row</text><text x="32" y="410" class="label" text-anchor="start">Tightly packed buffer</text><rect x="32" y="430" width="696" height="32" rx="4" fill="#edf2ff" stroke="#b6cee8" stroke-width="2"/><text x="48" y="454" class="mono" text-anchor="start">row 0: width × 3 bytes</text><rect x="32" y="466" width="696" height="32" rx="4" fill="#edf2ff" stroke="#b6cee8" stroke-width="2"/><text x="48" y="490" class="mono" text-anchor="start">row 1: width × 3 bytes</text><rect x="32" y="502" width="696" height="32" rx="4" fill="#edf2ff" stroke="#b6cee8" stroke-width="2"/><text x="48" y="526" class="mono" text-anchor="start">row 2: width × 3 bytes</text><text x="32" y="574" class="label" text-anchor="start">HFImageData expects tightly packed rows.</text>
</svg>