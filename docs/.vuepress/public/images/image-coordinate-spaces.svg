<svg xmlns="http://www.w3.org/2000/svg" width="760" height="585" viewBox="0 0 760 585" role="img" aria-labelledby="title desc">
<title id="title">From camera coordinates to the overlay</title><desc id="desc">The SDK rotates and resizes for processing, then maps face geometry back to raw input coordinates. The application applies its own preview scale, crop and mirror transform.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#5b728b" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#20354d} .title{font-size:28px;font-weight:700} .label{font-size:23px;font-weight:600} .small{font-size:20px;fill:#52677c} .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:22px} .tiny{font-size:18px;fill:#52677c}</style>
<rect width="760" height="585" rx="18" fill="#f8fafc"/>
<text x="32" y="47" class="title" text-anchor="start">From camera coordinates to the overlay</text>
<text x="32" y="88" class="small" text-anchor="start">SDK preprocessing and the UI are two different transforms</text><rect x="32" y="122" width="292" height="166" rx="14" fill="#e6f5ef" stroke="#add5c3" stroke-width="2"/><text x="52" y="155" class="label" text-anchor="start">Raw input frame</text><rect x="83" y="174" width="75" height="80" rx="6" fill="none" stroke="#208c71" stroke-width="2"/><text x="176" y="207" class="small" text-anchor="start">pixels +</text><text x="176" y="237" class="small" text-anchor="start">rotation flag</text><rect x="438" y="122" width="290" height="166" rx="14" fill="#edf2ff" stroke="#b6cee8" stroke-width="2"/><text x="458" y="155" class="label" text-anchor="start">SDK processing view</text><text x="458" y="196" class="small" text-anchor="start">Rotate / resize</text><text x="458" y="230" class="small" text-anchor="start">Detect / track</text><path d="M324 185 L438 185" fill="none" stroke="#5b728b" stroke-width="3" marker-end="url(#arrow)"/><text x="379" y="166" class="tiny" text-anchor="middle">input</text><path d="M438 261 L324 261" fill="none" stroke="#5b728b" stroke-width="3" marker-end="url(#arrow)"/><text x="379" y="307" class="tiny" text-anchor="middle">map results back</text><path d="M174 288 L174 366" fill="none" stroke="#5b728b" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="366" width="292" height="140" rx="14" fill="#e6f5ef" stroke="#add5c3" stroke-width="2"/><text x="52" y="403" class="label" text-anchor="start">Geometry in raw</text><text x="52" y="436" class="label" text-anchor="start">frame coordinates</text><text x="52" y="478" class="small" text-anchor="start">boxes / landmarks</text><rect x="438" y="366" width="290" height="140" rx="14" fill="#fff3df" stroke="#e4c691" stroke-width="2"/><text x="458" y="403" class="label" text-anchor="start">Displayed preview</text><text x="458" y="438" class="small" text-anchor="start">scale / crop / mirror</text><text x="458" y="478" class="small" text-anchor="start">overlay + image</text><path d="M324 438 L438 438" fill="none" stroke="#5b728b" stroke-width="3" marker-end="url(#arrow)"/><text x="379" y="351" class="tiny" text-anchor="middle">UI mapping</text><text x="32" y="554" class="small" text-anchor="start">Apply the same display transform to the image and geometry.</text>
</svg>