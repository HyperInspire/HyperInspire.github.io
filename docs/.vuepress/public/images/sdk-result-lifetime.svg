<svg xmlns="http://www.w3.org/2000/svg" width="760" height="616" viewBox="0 0 760 616" role="img" aria-labelledby="title desc">
<title id="title">Results and pixels have separate lifetimes</title><desc id="desc">Camera pixels stay valid until consumers finish. A borrowed detection view expires at the next detection, while an owned snapshot retains metadata but no pixels.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#5b728b" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#20354d} .title{font-size:28px;font-weight:700} .label{font-size:23px;font-weight:600} .small{font-size:20px;fill:#52677c} .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:22px} .tiny{font-size:18px;fill:#52677c}</style>
<rect width="760" height="616" rx="18" fill="#f8fafc"/>
<text x="32" y="47" class="title" text-anchor="start">Results and pixels have separate lifetimes</text>
<text x="32" y="87" class="small" text-anchor="start">One frame: retain pixels through all consumers</text><rect x="32" y="120" width="696" height="104" rx="14" fill="#e6f5ef" stroke="#b6cee8" stroke-width="2"/><text x="52" y="154" class="label" text-anchor="start">Frame pixels</text><text x="52" y="189" class="small" text-anchor="start">Owned by your application</text><rect x="32" y="246" width="696" height="104" rx="14" fill="#edf2ff" stroke="#b6cee8" stroke-width="2"/><text x="52" y="280" class="label" text-anchor="start">Detection view</text><text x="52" y="315" class="small" text-anchor="start">Borrowed from the C session</text><rect x="32" y="372" width="696" height="104" rx="14" fill="#fff3df" stroke="#b6cee8" stroke-width="2"/><text x="52" y="406" class="label" text-anchor="start">Owned snapshot</text><text x="52" y="441" class="small" text-anchor="start">Copied geometry and face tokens</text><text x="435" y="153" class="small" text-anchor="start">detect → analyze → extract</text><text x="435" y="189" class="small" text-anchor="start">then return camera buffer</text><text x="435" y="279" class="small" text-anchor="start">read before next detect()</text><text x="435" y="315" class="small" text-anchor="start">or create a snapshot</text><text x="435" y="405" class="small" text-anchor="start">survives later detections</text><text x="435" y="441" class="small" text-anchor="start">release when finished</text><path d="M380 291 L380 372" fill="none" stroke="#5b728b" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="510" width="696" height="80" rx="14" fill="#fff7ed" stroke="#f0cfaa" stroke-width="2"/><text x="52" y="543" class="label" text-anchor="start">Snapshot + matching frame</text><text x="52" y="573" class="small" text-anchor="start">Later extraction needs both the result and its matching frame.</text>
</svg>